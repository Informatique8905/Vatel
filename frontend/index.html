<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#072A5D" />
    <title>Ma Cantine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Loader « three-body » affiché jusqu'au montage de React (remplacé par l'app) -->
      <div class="boot">
        <div class="cv3">
          <div class="cv3-dot"></div>
          <div class="cv3-dot"></div>
          <div class="cv3-dot"></div>
        </div>
      </div>
    </div>
    <style>
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #F9F9F9; }
      .cv3 { --uib-size: 35px; --uib-speed: 0.8s; --uib-color: #072A5D; position: relative; display: inline-block; height: var(--uib-size); width: var(--uib-size); animation: cv3-spin calc(var(--uib-speed) * 2.5) infinite linear; }
      .cv3-dot { position: absolute; height: 100%; width: 30%; }
      .cv3-dot:after { content: ''; position: absolute; height: 0%; width: 100%; padding-bottom: 100%; background-color: var(--uib-color); border-radius: 50%; }
      .cv3-dot:nth-child(1) { bottom: 5%; left: 0; transform: rotate(60deg); transform-origin: 50% 85%; }
      .cv3-dot:nth-child(1)::after { bottom: 0; left: 0; animation: cv3-wobble1 var(--uib-speed) infinite ease-in-out; animation-delay: calc(var(--uib-speed) * -0.3); }
      .cv3-dot:nth-child(2) { bottom: 5%; right: 0; transform: rotate(-60deg); transform-origin: 50% 85%; }
      .cv3-dot:nth-child(2)::after { bottom: 0; left: 0; animation: cv3-wobble1 var(--uib-speed) infinite calc(var(--uib-speed) * -0.15) ease-in-out; }
      .cv3-dot:nth-child(3) { bottom: -5%; left: 0; transform: translateX(116.666%); }
      .cv3-dot:nth-child(3)::after { top: 0; left: 0; animation: cv3-wobble2 var(--uib-speed) infinite ease-in-out; }
      @keyframes cv3-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes cv3-wobble1 { 0%, 100% { transform: translateY(0%) scale(1); opacity: 1; } 50% { transform: translateY(-66%) scale(0.65); opacity: 0.8; } }
      @keyframes cv3-wobble2 { 0%, 100% { transform: translateY(0%) scale(1); opacity: 1; } 50% { transform: translateY(66%) scale(0.65); opacity: 0.8; } }
    </style>
    <!-- Composants animés KBR-UI (ui.rodolphekouadio.com), zéro dépendance -->
    <script src="/vendor/kbr/kbr-bundle.js" defer></script>
    <script src="/vendor/kbr/tear-ticket.js" defer></script>
    <script src="/vendor/kbr/skeleton-list.js" defer></script>
    <script src="/vendor/kbr/roll-text.js" defer></script>
    <script src="/vendor/kbr/vatel-pass.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
