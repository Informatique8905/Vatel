services:
  postgres:
    image: postgres:17-alpine
    container_name: vatel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vatel
      POSTGRES_PASSWORD: vatel
      POSTGRES_DB: vatel
    ports:
      # 5433 côté hôte : un PostgreSQL natif occupe déjà 5432 sur cette machine
      - "5433:5432"
    volumes:
      - vatel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vatel -d vatel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vatel_pgdata:
